<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Ranking Geral – Óticas Idealize</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Painel de Ranking Geral das Óticas Idealize – desempenho de consultores e lojas em tempo real." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <!-- HEADER -->
    <header class="topbar">
      <div class="brand">
        <img src="logo-oticas-idealize.png" alt="Óticas Idealize" class="logo-img" />
        <div class="brand-text">
          <span class="brand-eyebrow">Óticas Idealize</span>
          <h1>RANKING GERAL</h1>
        </div>
      </div>
      <div class="header-right">
        <div class="live-pill"><span class="live-dot"></span>AO VIVO</div>
      </div>
    </header>

    <!-- MAIN -->
    <main class="container">
      <section class="section">
        <div class="section-header">
          <span class="section-label">CONSULTORES</span>
          <h2 class="section-title">RANKING DE CONSULTORES</h2>
          <div class="section-line"></div>
        </div>
        <div id="podium" class="podium-wrap"></div>
        <div id="consultores-list" class="cards-grid"></div>
      </section>

      <section class="section">
        <div class="section-header">
          <span class="section-label">LOJAS</span>
          <h2 class="section-title">RANKING DE LOJAS</h2>
          <div class="section-line"></div>
        </div>
        <div id="lojas-list" class="cards-grid"></div>
      </section>
    </main>

    <footer class="footer">
      Atualizado automaticamente · Planilha Idealize Ranking Geral
    </footer>

    <script src="script.js"></script>
  </body>
</html>
